services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radextract_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data/db:/data/db
      - ./data/pdfs:/data/pdfs
      - ./data/exports:/data/exports
    environment:
      - RADEXTRACT_ENV=production
      - RADEXTRACT_DB_PATH=/data/db/radextract.db
      - RADEXTRACT_UPLOAD_ROOT=/data/pdfs
      - RADEXTRACT_EXPORT_ROOT=/data/exports
      - RADEXTRACT_JWT_SECRET=${SECRET_KEY:-radextract-secret-change-me-in-production}
      - RADEXTRACT_CORS_ORIGINS=${CORS_ORIGINS:-https://vidhidhaduk05.github.io,http://localhost:5173,http://localhost:3000}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://127.0.0.1:8081/v1/chat/completions}
      - LLM_API_KEY=${LLM_API_KEY:-sk-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@radextract.local}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: radextract_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
