[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radextract-platform"
version = "2.4.0"
description = "Full-lifecycle systematic review data extraction platform for radiology research articles"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "RadExtract Team"},
]
keywords = ["systematic-review", "meta-analysis", "radiology", "data-extraction", "risk-of-bias"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    # Web framework
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",

    # Settings & validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jsonschema>=4.0.0",

    # HTTP client
    "httpx>=0.24.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.1",  # passlib 1.7.4 breaks with bcrypt>=4.1 (5.x raises on register/login)

    # PDF processing
    "pypdfium2>=4.0.0",
    "pdfplumber>=0.10.0",
    "pymupdf>=1.23.0",

    # Data analysis (Phase 4)
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",

    # Machine learning & Document fixtures
    "scikit-learn>=1.3.0",
    "reportlab>=3.6.0",

    # Document export (PRISMA DOCX, coded extraction Excel)
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",

    # AWS / Serverless & Floci
    "boto3>=1.34.0",
    "mangum>=0.17.0",          # ASGI adapter for Lambda

    # AI Agent Orchestration
    "google-antigravity>=0.1.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[project.urls]
Repository = "https://github.com/vidhidhaduk05/VDExtract"

# ── Package discovery ──
[tool.setuptools.packages.find]
where = ["."]
include = [
    "routers*",
    "services*",
    "radextract_core*",
]

[tool.setuptools]
py-modules = ["main", "config", "database", "dependencies", "models"]

# ── Pytest ──
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "radextract_core/tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ── Ruff (linting, optional) ──
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
