name: RadExtract CI Quality & Testing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  link-and-format-check:
    name: Markdown & Link Integrity
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Markdown Formatting
        run: |
          npx prettier --check "README.md" "radextract_platform/backend/skills/**/*.md" || true

  python-backend-qa:
    name: Python Linting & Formatting Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Lint with Flake8
        run: |
          flake8 radextract_platform/backend --max-line-length=120 --extend-ignore=E203,W503,F401,F841,E501 || true

  python-backend-tests:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          cd radextract_platform/backend
          pip install -r requirements.txt
          pip install .
          pip install pytest pytest-asyncio moto faker httpx scikit-learn reportlab pymupdf

      - name: Run Backend Platform Tests
        working-directory: radextract_platform/backend
        run: |
          python -m pytest tests/ -v --tb=short

  frontend-build-check:
    name: Frontend TypeScript & Vite Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: radextract_platform/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: radextract_platform/frontend
        run: |
          npm install --legacy-peer-deps

      - name: Build Production Frontend
        working-directory: radextract_platform/frontend
        run: |
          npm run build

  localstack-aws-integration-test:
    name: LocalStack AWS (DynamoDB + S3) Integration Test
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      localstack:
        image: localstack/localstack:3.8.0
        ports:
          - 4566:4566
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          SERVICES: s3,dynamodb,iam,sts,logs
          DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          cd radextract_platform/backend
          pip install .
          pip install pytest pytest-asyncio moto faker httpx boto3

      - name: Wait for LocalStack Health Check
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:4566/_localstack/health > /dev/null 2>&1 || curl -s http://localhost:4566 > /dev/null 2>&1; then
              echo "LocalStack is up and running!"
              break
            fi
            echo "Waiting for LocalStack..."
            sleep 1
          done

      - name: Test LocalStack DynamoDB & S3 Resource Creation & Serverless Suite
        working-directory: radextract_platform/backend
        env:
          RADEXTRACT_STORAGE_BACKEND: s3
          RADEXTRACT_DB_BACKEND: dynamodb
          RADEXTRACT_AWS_ENDPOINT_URL: http://localhost:4566
          RADEXTRACT_AWS_ACCESS_KEY_ID: test
          RADEXTRACT_AWS_SECRET_ACCESS_KEY: test
          RADEXTRACT_AWS_DEFAULT_REGION: us-east-1
          RADEXTRACT_S3_PDF_BUCKET: radextract-pdfs
        run: |
          python scripts/init_aws_local.py
          python -m pytest tests/test_aws_serverless.py -v
