name: Deploy RadExtract to AWS Serverless (No Docker)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (production, staging)"
        required: true
        default: "production"
      region:
        description: "AWS Region"
        required: true
        default: "us-east-1"

jobs:
  test-and-deploy:
    name: Build, Test & Deploy to AWS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: radextract_platform/frontend/package-lock.json

      - name: Install Backend Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e radextract_platform/backend
          pip install pytest pytest-asyncio moto faker httpx scikit-learn reportlab boto3 mangum

      - name: Run Backend Unit & Integration Tests
        working-directory: radextract_platform/backend
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Install Frontend Dependencies
        working-directory: radextract_platform/frontend
        run: |
          npm install --legacy-peer-deps

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.region || 'us-east-1' }}

      - name: Execute Serverless Deployment
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          python deploy/aws-deploy.py --env ${{ github.event.inputs.environment || 'production' }} --region ${{ github.event.inputs.region || 'us-east-1' }}
