# Fly.io config — RadExtract backend
# Deploy:
#   fly launch --no-deploy --copy-config        (from repo root, answer to create new app)
#   fly volumes create radextract_data --size 5 --region iad
#   fly secrets set PUBMED_API_KEY=...          (optional)
#   fly deploy
app = "radextract-backend"
primary_region = "iad"

[build]
  dockerfile = "radextract_platform/backend/Dockerfile"

[env]
  DATABASE_PATH = "/data/database/radextract.db"
  STORAGE_ROOT = "/data/storage/PROJECTS"
  ENV = "production"
  CORS_ORIGINS = "https://vidhidhaduk05.github.io"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "radextract_data"
  destination = "/data"
